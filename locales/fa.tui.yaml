# ماه‌افزار هوشمند رسا — بستهٔ رابط ترمینالی (TUI)
# Flat dotted keys; every key from locales/_keys.tui.json. Function-valued en entries use
# positional {0}, {1} placeholders.
# قراردادها: نام دستورها (hermes …)، مسیرها، کلیدهای پیکربندی، شناسه مدل‌ها، نام ارائه‌دهنده‌ها،
# کلیدهای صفحه‌کلید (↑/↓، Tab، Enter، Esc) و نشانی‌ها عیناً حفظ می‌شوند؛ فقط مقادیر ترجمه می‌شوند.

