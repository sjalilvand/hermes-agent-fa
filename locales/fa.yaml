      این گفتگوی اصلی برای دستورهای سیستمی رزرو شده است.

      برای شروع یک گفتگوی جدید رسا، topic All Messages را در بالای همین رابط بات باز کنید و هر پیامی آنجا بفرستید. Telegram برای آن پیام یک topic جدید می‌سازد؛ هر topic به‌عنوان یک نشست مستقل رسا کار می‌کند.
    root_new: |-
      برای شروع یک گفتگوی موازی جدید با رسا، topic All Messages را در بالای همین رابط بات باز کنید و هر پیامی آنجا بفرستید. Telegram برای آن topic جدیدی می‌سازد.

      هر topic یک نشست مستقل رسا است. از /new داخل یک topic موجود فقط وقتی استفاده کنید که بخواهید نشست فعلی آن topic را جایگزین کنید.
    new_header: |-
      یک نشست جدید رسا در این topic آغاز شد.

      نکته: برای کار موازی، All Messages را باز کنید و پیامی آنجا بفرستید تا به‌جای /new در همین‌جا topic جداگانه‌ای ساخته شود. /new نشستِ متصل به topic فعلی را جایگزین می‌کند.
    help: |-
      /topic — فعال‌سازی حالت DM چندنشستی (یک بات، چند گفتگوی موازی)

      کاربرد:
        /topic             فعال‌سازی حالت topic، یا نمایش وضعیت اگر از قبل روشن است
        /topic help        نمایش همین پیام
        /topic off         غیرفعال‌سازی حالت topic و پاک کردن پیوندهای topic
        /topic <id>        داخل یک topic: بازیابی نشست قبلی با شناسه

      نحوهٔ کار:
      1. یک‌بار /topic را در همین DM اجرا کنید — رسا بررسی می‌کند Threads
         Settings در BotFather فعال باشد و حالت چندنشستی را روشن می‌کند.
      2. روی All Messages در بالای بات بزنید و هر پیامی بفرستید.
         Telegram برای آن پیام topic جدیدی می‌سازد؛ هر topic یک
         نشست مستقل رسا است (تاریخچه و زمینهٔ تازه).
      3. DM ریشه به یک لابی سیستمی تبدیل می‌شود — /topic، /status،
         /help و /usage را آنجا بفرستید. پرامپت‌های عادی در topic می‌روند.
      4. /new داخل یک topic فقط نشست همان topic را بازنشانی می‌کند.
      5. /topic <id> داخل یک topic نشست قدیمی را در آن بازیابی می‌کند.
