# ماه‌افزار هوشمند رسا (Rasa) — catalog پیام‌های ایستا — فارسی
#
# برگرفته از locales/en.yaml (fork of Hermes Agent). فقط نثر ایستای کاربر-ممتنع
# ترجمه شده: نام دستورها، /slash commands، کلیدهای پیکربندی، مسیرها، URLها،
# شناسه‌های مدل، نام ارائه‌دهنده‌ها، ایموجی‌ها و توکن‌های {placeholder} عیناً حفظ
# می‌شوند تا درون‌یابی و شناسه‌ها درست کار کنند. tests/agent/test_i18n.py برای
# این زبان (partial catalog) فقط parity جای‌نگهدارها را سخت‌گیرانه بررسی می‌کند.
#
# Conventions (same as locales/ar.yaml):
#   - Machine-parsed status values that code compares against stay verbatim
#     (e.g. fast.status_fast stays "fast").
#   - Prompt-choice characters ([o]/[s]/[a]/[d]) stay Latin so keyboard input
#     keys keep matching gateway/approval input parsing.
approval:
  dangerous_header: '⚠️  دستور خطرناک: {description}'
  choose_long: '      [o] یک‌بار  |  [s] این نشست  |  [a] همیشه  |  [d] رد'
  choose_short: '      [o] یک‌بار  |  [s] این نشست  |  [d] رد'
  prompt_long: '      انتخاب [o/s/a/D]: '
  prompt_short: '      انتخاب [o/s/D]: '
  choose_smart_deny: '      [o] یک‌بار  |  [d] رد'
  prompt_smart_deny: '      انتخاب [o/D]: '
  smart_deny_once_inputs: o,once
  smart_deny_deny_inputs: d,deny
  timeout: '      ⏱ پایان مهلت پس از {waited} — دستور اجرا نشد. برای تلاش دوباره دوباره بپرسید، یا سقف را بالا ببرید: hermes config set approvals.timeout {suggested}'
  allowed_once: '      ✓ یک‌بار مجاز شد'
  allowed_session: '      ✓ برای این نشست مجاز شد'
  allowed_always: '      ✓ به فهرست دائمی مجازها اضافه شد'
  denied: '      ✗ رد شد'
  cancelled: '      ✗ لغو شد'
  blocklist_message: این دستور در فهرست مسدودِ غیرمشروط قرار دارد و قابل تأیید نیست.
  inputs:
    approve: approve,yes,ok,okay,confirm,y
    deny: deny,no,reject,cancel,n
    always: always,approve always,always approve
    session: session,approve session,session approve
    confirm_once: approve,approve once,once,yes,ok,confirm
    confirm_always: always,always approve,remember
    confirm_cancel: cancel,nevermind,no,deny
  summary:
    denied: شما این {noun} را رد کردید — اجرا نشد.
    timeout: پاسخی در {window} دریافت نشد — این {noun} اجرا نشد.
    notify_failed: درخواست تأیید قابل تحویل نبود — این {noun} اجرا نشد.
    cancelled: درخواست تأیید پس گرفته شد یا هرگز به شما نرسید — این {noun} اجرا نشد.
    blocked: این {noun} در نشست بدون‌نظارت مجاز نیست — اجرا نشد.
    default: این {noun} اجرا نشد.
  noun:
    command: دستور
    code: کد
    action: کنش
  window:
    hour_one: '{count} ساعت'
    hour_other: '{count} ساعت'
    minute_one: '{count} دقیقه'
    minute_other: '{count} دقیقه'
    second_one: '{count} ثانیه'
    second_other: '{count} ثانیه'
