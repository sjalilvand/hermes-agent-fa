explainer:
  no_reply_prefix: '⚠️ بدون پاسخ: '
  empty_response: '{model} این بار حتی با تلاش‌های دوباره پاسخی تولید نکرد. `continue` را بفرستید تا دوباره تلاش کند، یا با /model مدل را عوض کنید.'
  exit:
    all_retries_exhausted_no_response: ارائه‌دهنده مدل پس از همه تلاش‌های دوباره پاسخ نداد. /retry را بفرستید، یا با /model مدل را عوض کنید.
    partial_stream_recovery: استریم زودتر قطع شد و فقط بخشی از پاسخ بازیابی شد. `continue` را بفرستید تا از همان‌جا که قطع شد ادامه یابد.
    fallback_prior_turn_content: در این نوبت محتوای جدیدی تولید نشد؛ زمینه بازیابی‌شده قبلی نشان داده می‌شود. برای تلاش دوباره `continue` را بفرستید.
    redirect_restart_limit_exceeded: در هر تلاش، درخواست با یک اصلاح جدید لغو می‌شد، بنابراین نوبت به‌جای تلاش بی‌پایان متوقف شد. آخرین اصلاح شما به‌عنوان پیام بعدی در صف است.
    rebuilt_restart_limit_exceeded: همه ارائه‌دهنده‌های زنجیره جایگزین یکی پس از دیگری شکست خوردند، بنابراین نوبت به‌جای تلاش بی‌پایان متوقف شد. `continue` را بفرستید یا ارائه‌دهنده را عوض کنید.
    budget_exhausted: سقف تکرار/هزینه این نوبت پیش از پاسخ نهایی تمام شد. برای ادامه `continue` را بفرستید.
    ollama_runtime_context_too_small: پنجره زمینه مدل محلی برای پایان کار کوچک بود. اندازه زمینه را بالا ببرید یا از مدل بزرگ‌تری استفاده کنید.
    pending_tool_result: نوبت وقتی متوقف شد که نتیجه یک ابزار هنوز در انتظار بود و مدل متنی در پی نداشت. `continue` را بفرستید تا خلاصه‌اش کند.
    interrupted_during_api_call: درخواست در میانه فراخوانی، پیش از رسیدن پاسخ، قطع شد. برای تلاش دوباره `continue` را بفرستید.
    max_iterations_reached: سقف بیشینه تکرار ابزار پیش از پاسخ نهایی پر شد. برای ادامه `continue` را بفرستید، یا `max_iterations` را بالا ببرید.
    error_near_max_iterations: نزدیک سقف تکرار خطایی رخ داد و پاسخ نهایی به دست نیامد. خروجی ابزار بالا را بررسی کنید، سپس `continue` را بفرستید.
    repeated_outer_errors: نوبت پی‌درپی با خطاهای تکراری شکست می‌خورد و به‌جای تلاش بی‌پایان زودتر متوقف شد. خطاهای بالا را بررسی کنید، سپس برای تلاش دوباره `continue` را بفرستید.
  persistence:
    compression: نوبت متوقف شد چون فرایند دیگری در حال فشرده‌سازی این نشست بود. پیام شما احتمالاً ذخیره شده — لطفاً پس از پایان فشرده‌سازی دوباره بفرستیدش.
    compression_closed: نوبت متوقف شد چون این نشست با فشرده‌سازی زمینه چرخش کرد و ادامه زنده آن قابل تصاحب نبود. خود ذخیره‌سازی سالم است — مشتری را تازه‌سازی کنید (یا نوبت جدیدی شروع کنید) تا شناسه نشست جدید برداشته شود، سپس پیام خود را دوباره بفرستید.
    turn_lease: نوبت متوقف شد چون فرایند دیگری از رسا تصاحب این نشست را به دست گرفت. پاسخ شما ذخیره نشد — صبر کنید کار فرایند دیگر تمام شود، سپس پیام خود را دوباره بفرستید.
    session_row_missing: این نشست در حالی که گفتگو هنوز باز بود از ذخیره‌سازی حذف شد و رسا نتوانست آن را بازسازی کند؛ بنابراین این پیام ذخیره نشد. پیام خود را دوباره بفرستید؛ اگر باز هم شکست خورد، `hermes {profile_arg}doctor` را اجرا کنید.
    locked: نوبت متوقف شد چون ذخیره‌سازی نشست مشغول بود (فرایند دیگری از رسا روی پایگاه‌داده حالت می‌نوشت). پیام شما احتمالاً ذخیره شده — لطفاً لحظه‌ای بعد دوباره بفرستیدش.
    replaced: فایل پایگاه‌داده نشست در حین اجرای رسا جایگزین شد، بنابراین این پیام ذخیره نشد (نسخه‌ای در {home}/sessions/ نگه داشته شده). رسا را متوقف کنید (`hermes {profile_arg}gateway stop`)، سپس `hermes {profile_arg}doctor` را اجرا کنید — نه `hermes {profile_arg}doctor --fix`، که فایل اشتباه را در همان‌جا ترمیم می‌کند — و پس از راه‌اندازی دوباره، پیام را یک بار دیگر بفرستید. گام‌های بازیابی پیشرفته در لاگ هست.
    deleted_wal: 'یک فرایند دیگر از رسا هنوز نسخه قدیمیِ لاگ نوشتنِ پایگاه‌داده نشست (write-ahead log) را نگه داشته است، بنابراین رسا برای ایمن ماندن فایل نوشتن را قطع کرد و این پیام ذخیره نشد (نسخه‌ای در {home}/sessions/ نگه داشته شده). هیچ چیز از دست نرفته است. همه فرایندهای رسا در این پروفایل را ببندید (اپ دسکتاپ، `hermes {profile_arg}gateway stop`، داشبورد، cron)، سپس `hermes {profile_arg}doctor` را اجرا کنید — نام هر فرایندی که هنوز لاگ را نگه داشته را می‌گوید — و بعد رسا را دوباره راه بیندازید و پیام را یک بار دیگر بفرستید. تا وقتی فرایندها در حال اجرا هستند `doctor --fix` را اجرا نکنید و هیچ فایل state.db را حذف نکنید. راهنما: {recovery_docs}'
    corrupt: |-
      نوبت متوقف شد چون پایگاه‌داده حالت خرابی ساختاری گزارش کرد (گفت‌وگو در راه‌اندازی مجدد از دست می‌رفت). آزاد کردن فضای دیسک کمکی نمی‌کند. گزینه‌های بازیابی:
      1. `hermes {profile_arg}doctor --fix` را اجرا کنید
      2. دروازه را متوقف کنید، سپس با این بازیابی کنید:
         hermes {profile_arg}sessions recover --source {db_path} --inspect-only
         (اگر قابل بازیابی گزارش کرد) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db
         — بازیابی ابتدا از فایل آسیب‌دیده تصویر وضعیت می‌گیرد؛ روی state.db زنده `sqlite3 ... ".recover"` اجرا نکنید؛ یک sqlite3 آسیب‌پذیر می‌تواند خرابی را بدتر کند
      3. از پشتیبان در {backups_dir}/ بازگردانی کنید
      سپس پیام خود را دوباره بفرستید.
    fts_index: 'نوبت متوقف شد چون نمایه جستجوی نشست (FTS5) خراب بود و جدا کردنش ممکن نشد؛ بنابراین این پیام ذخیره نشد. خود انبار پیام آسیب ندیده: ابزار بازیابی اجرا نکنید و پشتیبان بازگردانی نکنید. `hermes {profile_arg}doctor --fix` را اجرا کنید (یا رسا را راه‌اندازی مجدد کنید که هنگام باز کردن، نمایه را ترمیم می‌کند)، سپس پیام خود را دوباره بفرستید.'
    disk: 'رسا نتوانست این گفتگو را روی دیسک ذخیره کند، پس به‌جای از دست دادن پیام‌هایتان متوقف شد. احتمالاً دیسک پر است: کمی فضا آزاد کنید (یا مجوزهای {home}/state.db را درست کنید)، سپس پیام خود را دوباره بفرستید.'
    default: 'رسا نتوانست این گفتگو را ذخیره کند، پس به‌جای از دست دادن پیام‌هایتان متوقف شد. احتمال‌ها: پر بودن درایو، یا تصاحب پایگاه‌داده توسط فرایند دیگری از رسا. پنجره‌های دیگر رسا را ببندید، `hermes {profile_arg}doctor` را برای بررسی انبار اجرا کنید، سپس پیام خود را دوباره بفرستید.'
  file_mutation:
    header: '⚠️ تأییدکننده تغییر فایل: {count} ویرایش فایل در این نوبت ناموفق بود، با هر عبارتی در بالا که خلافش را بگوید. برای دیدن اینکه واقعاً چه چیزی اعمال شده `git status` یا `read_file` را اجرا کنید.'
    entry: '  • `{path}` — [{tool}] {preview}'
    failed: ناموفق
  shared:
    and_more: '  • … و {count} مورد دیگر'
    the_model: مدل
tips:
  t001: /bg <prompt> یک وظیفه را در نشستی جدا اجرا می‌کند و نشست فعلی شما آزاد می‌ماند؛ /btw <question> بدون وقفه به یک سؤال کناری درباره همین گفتگو پاسخ می‌دهد.
  t002: /branch از نشست جاری انشعاب می‌گیرد تا بتوانید بدون از دست دادن پیشرفت، مسیر دیگری را امتحان کنید.
  t003: /compress وقتی گفتگو طولانی شد، زمینه را دستی فشرده می‌کند.
  t004: /rollback نقطه‌های بازیابی سیستم فایل را فهرست می‌کند — فایل‌هایی که عامل تغییر داده را به هر وضعیت قبلی می‌توانید برگردانید.
  t005: /rollback diff 2 پیش‌نمایش تغییرات از نقطه بازیابی 2 را نشان می‌دهد، بدون بازگردانی چیزی.
  t006: /rollback 2 src/file.py یک فایل مشخص را از یک نقطه بازیابی خاص برمی‌گرداند.
  t007: /title "my project" به نشست شما نام می‌دهد — بعداً با /resume یا hermes -c ادامه‌اش دهید.
  t008: /resume کار را از همان‌جایی که رها کرده بودید در نشست نام‌دار قبلی ادامه می‌دهد.
  t009: /queue <prompt> پیامی را بدون وقفه در نوبت جاری، برای نوبت بعدی صف می‌کند.
  t010: /undo آخرین تبادل کاربر/دستیار را از گفتگو حذف می‌کند.
  t011: /retry آخرین پیام شما را دوباره می‌فرستد — وقتی پاسخ عامل چندان درست نبوده به کار می‌آید.
  t012: '/verbose نمایش پیشرفت ابزار را می‌چرخاند: off → new → all → verbose.'
  t013: /reasoning high عمق تفکر مدل را بالا می‌برد. /reasoning show استدلال را نمایش می‌دهد.
  t014: /fast پردازش اولویت‌دار را برای پاسخ‌های سریع‌تر API روشن‌وخاموش می‌کند (بسته به ارائه‌دهنده).
  t015: /yolo تا پایان نشست همه پرسش‌های تأیید دستور خطرناک را بدون پرسش می‌گذراند.
  t016: /model اجازه می‌دهد وسط نشست مدل را عوض کنید — مثلاً /model sonnet یا /model gpt-5 را امتحان کنید.
  t017: /model --global مدل پیش‌فرض شما را برای همیشه تغییر می‌دهد.
  t018: /personality pirate یک شخصیت سرگرم‌کننده تنظیم می‌کند — 14 گزینه داخلی از kawaii تا shakespeare.
  t019: /skin تم CLI را عوض می‌کند — ares، mono، slate، poseidon یا charizard را امتحان کنید.
  t020: /statusbar نوار همیشگیِ نمایش مدل، توکن، درصد پر شدن زمینه، هزینه و مدت را روشن‌وخاموش می‌کند.
  t021: /tools disable browser ابزارهای مرورگر را موقتاً برای نشست جاری از کار می‌اندازد.
  t022: /browser connect ابزارهای مرورگر را از طریق CDP به مرورگر Chromiumی در حال اجرای شما وصل می‌کند.
  t023: /plugins افزونه‌های نصب‌شده و وضعیتشان را فهرست می‌کند.
  t024: /cron وظایف زمان‌بندی‌شده را مدیریت می‌کند — پرامپت‌های تکراری با ارسال به هر پلتفرمی بسازید.
  t025: /reload-mcp پیکربندی سرورهای MCP را بدون راه‌اندازی مجدد داغ به‌روز می‌کند.
  t026: /usage مصرف توکن، تفکیک هزینه و مدت نشست را نشان می‌دهد.
  t027: /insights آمار مصرف 30 روز گذشته را نشان می‌دهد.
  t028: /paste کلیپ‌بورد شما را برای تصویر بررسی و آن را به پیام بعدی پیوست می‌کند.
  t029: /profile نشان می‌دهد کدام پروفایل فعال است و پوشه خانه‌اش کجاست.
  t030: /config پیکربندی فعلی شما را یک‌جا نشان می‌دهد.
  t031: /stop همه فرایندهای پس‌زمینه‌ای را که عامل به راه انداخته می‌کشد.
  t032: '@file:path/to/file.py محتوای فایل را مستقیم داخل پیام شما تزریق می‌کند.'
  t033: '@file:main.py:10-50 فقط خطوط 10 تا 50 فایل را تزریق می‌کند.'
  t034: '@folder:src/ فهرست درختی یک پوشه را تزریق می‌کند.'
  t035: '@diff تغییرات ثبت‌نشده git شما را داخل پیام تزریق می‌کند.'
  t036: '@staged تغییرات ثبت‌شده (staged) git شما را تزریق می‌کند (git diff --staged).'
  t037: '@git:5 پنج کامیت آخر را با پچ‌های کامل تزریق می‌کند.'
  t038: '@url:https://example.com محتوای یک صفحه وب را می‌گیرد و تزریق می‌کند.'
  t039: با تایپ @ تکمیل مسیر سیستم فایل فعال می‌شود — تعاملی به هر فایلی بروید.
  t040: 'چند ارجاع را ترکیب کنید: "@file:main.py و @file:test.py را برای سازگاری بررسی کن."'
  t041: Alt+Enter برای ورودی چندخطی خط نو درج می‌کند. (Windows Terminal ،Alt+Enter را می‌رباید — به‌جایش از Ctrl+Enter استفاده کنید.)
  t042: Ctrl+C عامل را قطع می‌کند. دوبار فشردن ظرف 2 ثانیه یعنی خروج اجباری.
  t043: Ctrl+Z رسا را به پس‌زمینه معلق می‌کند — در پوسته خود fg را اجرا کنید تا ادامه یابد.
  t044: Tab متن شبحِ پیشنهاد خودکار را می‌پذیرد یا دستورهای slash را تکمیل می‌کند.
  t045: در حین کار عامل پیام جدیدی تایپ کنید تا کار قطع و به مسیر دیگری هدایت شود.
  t046: Alt+V تصویری از کلیپ‌بورد شما را داخل گفتگو می‌چسباند.
  t047: چسباندن 5 خط یا بیشتر به‌طور خودکار در فایلی ذخیره و به‌جای آن یک ارجاع فشرده درج می‌شود.
  t048: hermes -c آخرین نشست CLI شما را ادامه می‌دهد. hermes -c "project name" بر اساس عنوان ادامه می‌دهد.
  t049: hermes -w یک worktree جدای git می‌سازد — عالی برای گردش‌کارهای موازی عامل.
  t050: 'hermes -w -q "Fix issue #42" جداسازی worktree را با یک پرسش یک‌باره ترکیب می‌کند.'
  t051: hermes chat -t web,terminal فقط مجموعه‌ابزارهای مشخصی را برای نشستی متمرکز فعال می‌کند.
  t052: hermes chat -s github-pr-workflow یک مهارت را هنگام راه‌اندازی پیش‌بار می‌کند.
  t053: hermes chat -q "query" یک پرسش غیرتعاملی تک‌موردی را اجرا می‌کند و خارج می‌شود.
  t054: hermes chat --max-turns 1000 سقف پیش‌فرض 500 تکرار در هر نوبت را بازنویسی می‌کند.
  t055: hermes chat --checkpoints پیش از هر تغییر مخرب فایل، تصویر وضعیت سیستم فایل می‌گیرد.
  t056: hermes --yolo برای کل نشست همه پرسش‌های تأیید دستور خطرناک را می‌گذراند.
  t057: hermes chat --source telegram نشست را برای فیلتر کردن در hermes sessions list برچسب می‌زند.
  t058: hermes -p work chat زیر پروفایلی مشخص اجرا می‌شود، بدون تغییر پیش‌فرض شما.
  t059: hermes doctor --fix مشکل‌های پیکربندی و وابستگی‌ها را تشخیص می‌دهد و خودکار ترمیم می‌کند.
  t060: hermes dump خلاصه فشرده راه‌اندازی را چاپ می‌کند — برای گزارش اشکال عالی است.
  t061: hermes config set KEY VALUE رمزها را خودکار به .env و بقیه را به config.yaml می‌فرستد.
  t062: hermes config edit فایل config.yaml را در ویرایشگر پیش‌فرض شما باز می‌کند.
  t063: hermes config check گزینه‌های پیکربندی جاافتاده یا منسوخ را اسکن می‌کند.
  t064: hermes sessions browse یک انتخاب‌گر تعاملی نشست با جستجو باز می‌کند.
  t065: hermes sessions stats تعداد نشست‌ها به تفکیک پلتفرم و حجم پایگاه‌داده را نشان می‌دهد.
  t066: hermes sessions prune --older-than 30 نشست‌های قدیمی را پاک‌سازی می‌کند.
  t067: hermes skills search react --source skills-sh فهرست عمومی skills.sh را جستجو می‌کند.
  t068: hermes skills check مهارت‌های نصب‌شده از هاب را برای به‌روزرسانی بالادستی اسکن می‌کند.
  t069: hermes skills tap add myorg/skills-repo یک منبع مهارت سفارشی GitHub اضافه می‌کند.
  t070: hermes skills snapshot export setup.json پیکربندی مهارت‌های شما را برای پشتیبان‌گیری یا اشتراک برون‌بری می‌کند.
  t071: hermes mcp add github --command npx سرورهای MCP را از خط فرمان اضافه می‌کند.
  t072: hermes mcp serve خودِ رسا را به‌عنوان سرور MCP برای عامل‌های دیگر اجرا می‌کند.
  t073: hermes auth add اجازه می‌دهد چند کلید API برای گردش استخر اعتبارنامه‌ها اضافه کنید.
  t074: hermes completion bash >> ~/.bashrc تکمیل تب را برای همه دستورها و پروفایل‌ها فعال می‌کند.
  t075: hermes logs -f لاگ agent.log را در زمان واقعی دنبال می‌کند. --level WARNING --since 1h خروجی را فیلتر می‌کند.
  t076: hermes backup از کل پوشه خانه رسا یک پشتیبان zip می‌سازد.
  t077: hermes profile create coder پروفایلی جدا می‌سازد که خودش یک دستور مستقل می‌شود.
  t078: hermes profile create work --clone پیکربندی و کلیدهای فعلی شما را به پروفایل جدید کپی می‌کند.
  t079: hermes update مهارت‌های باندل‌شده جدید را به‌طور خودکار با همه پروفایل‌ها هم‌گام می‌کند.
  t080: hermes gateway install رسا را به‌عنوان سرویس سیستم (systemd/launchd) برپا می‌کند.
  t081: hermes memory setup اجازه می‌دهد یک ارائه‌دهنده حافظه خارجی (Honcho، Mem0 و غیره) پیکربندی کنید.
  t082: hermes webhook subscribe مسیرهای وب‌هوک رویدادمحور با اعتبارسنجی HMAC می‌سازد.
  t083: 'صرفه‌جویی در هزینه: hermes tools ابزارهای بی‌استفاده را خاموش می‌کند، hermes skills config مهارت‌ها را سبک می‌کند.'
  t084: /reasoning low یا /reasoning minimal عمق تفکر را زیر پیش‌فرض (medium) می‌آورد — پاسخ سریع‌تر و ارزان‌تر.
  t085: hermes models وظایف بینایی، فشرده‌سازی و کمکی را به مدل‌های ارزان‌تر می‌سپارد — هزینه توکن پس‌زمینه بیش از 85٪ کم می‌شود، بدون پایین آوردن مدل اصلی گفتگوی شما.
  t086: 'display.bell_on_complete: true را در config.yaml تنظیم کنید تا پایان کارهای طولانی با زنگ خبر شود.'
  t087: 'display.streaming: true را تنظیم کنید تا توکن‌ها را در زمان واقعی و هم‌زمان با تولید مدل ببینید.'
  t088: 'display.show_reasoning: true را تنظیم کنید تا زنجیره تفکر مدل را تماشا کنید.'
  t089: 'display.compact: true را تنظیم کنید تا فاصله‌های خروجی کم شود و اطلاعات متراکم‌تر شود.'
  t090: 'display.busy_input_mode: queue را تنظیم کنید تا پیام‌ها به‌جای قطع عامل صف شوند، یا steer تا در میانه اجرا با /steer تزریق شوند.'
  t091: 'display.resume_display: minimal را تنظیم کنید تا هنگام ادامه نشست، بازگویی کامل گفتگو حذف شود.'
  t092: 'compression.threshold: 0.50 را تنظیم کنید تا کنترل کنید فشرده‌سازی خودکار کِی فعال شود (پیش‌فرض: 50٪ زمینه).'
  t093: 'agent.max_turns: 1000 را تنظیم کنید تا عامل در هر نوبت گام‌های بیشتری برای فراخوانی ابزار بردارد.'
  t094: 'file_read_max_chars: 200000 را تنظیم کنید تا بیشینه محتوای هر فراخوانی read_file بیشتر شود.'
  t095: 'approvals.mode: smart را تنظیم کنید تا یک LLM دستورهای امن را خودکار تأیید و دستورهای خطرناک را خودکار رد کند.'
  t096: fallback_model را در config.yaml تنظیم کنید تا خودکار به ارائه‌دهنده پشتیبان سوئیچ شود.
  t097: 'privacy.redact_pii: true را تنظیم کنید تا شناسه کاربرها و شماره تلفن‌ها پیش از ارسال به LLM هش شوند.'
  t098: 'browser.record_sessions: true را تنظیم کنید تا نشست‌های مرورگر خودکار به‌صورت ویدیوی WebM ضبط شوند.'
  t099: 'worktree: true را در config.yaml تنظیم کنید تا همیشه worktree گیت ساخته شود (مانند hermes -w).'
  t100: 'security.website_blocklist.enabled: true را تنظیم کنید تا دامنه‌های مشخصی از ابزارهای وب مسدود شوند.'
  t101: 'cron.wrap_response: false را تنظیم کنید تا خروجی خام عامل بدون سرصفحه/پانویس cron تحویل شود.'
  t102: HERMES_TIMEZONE منطقه زمانی سرور را با هر رشته IANA بازنویسی می‌کند.
  t103: 'جای‌گذاری متغیر محیطی در config.yaml کار می‌کند: از نحو ${VAR_NAME} استفاده کنید.'
  t104: دستورهای سریع در config.yaml فرمان پوسته را بی‌درنگ و بدون مصرف توکن اجرا می‌کنند.
  t105: شخصیت‌های سفارشی را می‌توانید در config.yaml زیر agent.personalities تعریف کنید.
  t106: provider_routing مرتب‌سازی، فهرست سفید و فهرست سیاه ارائه‌دهنده‌های OpenRouter را کنترل می‌کند.
  t107: execute_code اسکریپت‌های پایتونی را اجرا می‌کند که به‌صورت برنامه‌ای ابزارهای رسا را صدا می‌زنند — نتایج وارد زمینه نمی‌شوند.
  t108: delegate_task به‌طور پیش‌فرض تا 10 زیرعامل همزمان (delegation.max_concurrent_children) با زمینه‌های جدا می‌سازد تا کار موازی انجام شود.
  t109: web_extract روی URLهای PDF کار می‌کند — هر پیوند PDF بدهید تا به markdown تبدیل شود.
  t110: search_files بر پایه ripgrep است و از grep سریع‌تر — به‌جای grep ترمینال از آن استفاده کنید.
  t111: patch از 9 راهبرد تطبیق فازی استفاده می‌کند تا تفاوت‌های جزئی فاصله‌گذاری ویرایش‌ها را نمی‌شکند.
  t112: patch قالب V4A را برای ویرایش انبوه چندفایلی در یک فراخوانی پشتیبانی می‌کند.
  t113: read_file وقتی فایلی پیدا نشود نام‌های مشابه را پیشنهاد می‌دهد.
  t114: read_file خودش داده تکراری را حذف می‌کند — خواندن دوباره فایل تغییرنکرده یک پوسته سبک برمی‌گرداند.
  t115: browser_vision عکس صفحه می‌گیرد و با هوش مصنوعی تحلیلش می‌کند — برای CAPTCHA و محتوای تصویری کاربرد دارد.
  t116: browser_console می‌تواند عبارت‌های جاوااسکریپت را در بافت صفحه اجرا کند.
  t117: image_generate با FLUX 2 Pro و بزرگ‌نمایی خودکار 2 برابری تصویر می‌سازد.
  t118: text_to_speech متن را به صدا تبدیل می‌کند — در تلگرام به‌صورت حباب صوتی پخش می‌شود.
  t119: send_message می‌تواند از درون یک نشست به هر پلتفرم پیام‌رسانِ وصل پیام بفرستد.
  t120: ابزار todo به عامل کمک می‌کند در طول نشست وظایف پیچیده چندمرحله‌ای را پیگیری کند.
  t121: session_search جستجوی تمام‌متن روی همه گفتگوهای پیشین انجام می‌دهد.
  t122: عامل به‌طور خودکار ترجیح‌ها، اصلاح‌ها و حقایق محیط را در حافظه ذخیره می‌کند.
  t123: /moa یک پرامپت سخت را از مجموعه مدل‌های ترکیب عامل‌ها (Mixture of Agents) پیکربندی‌شده شما عبور می‌دهد.
  t124: دستورهای ترمینال از حالت پس‌زمینه با notify_on_complete برای وظایف طولانی پشتیبانی می‌کنند.
  t125: فرایندهای پس‌زمینه ترمینال از watch_patterns پشتیبانی می‌کنند تا روی خطوط خروجی مشخص هشدار دهند.
  t126: 'ابزار ترمینال از 6 بک‌اند پشتیبانی می‌کند: local، Docker، SSH، Modal، Daytona و Singularity.'
  t127: هر پروفایل پیکربندی، کلیدهای API، حافظه، نشست‌ها، مهارت‌ها و وظایف زمان‌بندی خودش را دارد.
  t128: نام پروفایل‌ها به دستور پوسته تبدیل می‌شود — 'hermes profile create coder' دستور 'coder' را می‌سازد.
  t129: hermes profile export coder -o backup.tar.gz یک بسته پروفایل قابل حمل می‌سازد.
  t130: اگر ناخواسته دو پروفایل یک توکن ربات داشته باشند، دروازه دوم با خطای روشن متوقف می‌شود.
  t131: نشست‌ها پس از اولین تبادل، خودشان عنوان توصیفی می‌گیرند — نیازی به نام‌گذاری دستی نیست.
  t132: 'عنوان نشست‌ها تبار دارند: "my project" → "my project #2" → "my project #3".'
  t133: هنگام خروج، رسا فرمان ادامه همراه با شناسه نشست و آمار چاپ می‌کند.
  t134: hermes sessions export backup.jsonl همه نشست‌ها را برای پشتیبان‌گیری یا تحلیل برون‌بری می‌کند.
  t135: hermes -r SESSION_ID هر نشست مشخصی را با شناسه‌اش ادامه می‌دهد.
  t136: حافظه یک تصویر وضعیت منجمد است — تغییرات فقط در شروع نشست بعدی وارد پرامپت سیستم می‌شوند.
  t137: مدخل‌های حافظه به‌طور خودکار از نظر الگوهای تزریق پرامپت و بیرون‌کشی داده اسکن می‌شوند.
  t138: 'عامل دو انبار حافظه دارد: یادداشت‌های شخصی (~2200 نویسه) و پروفایل کاربر (~1375 نویسه).'
  t139: اصلاح‌هایی که به عامل می‌دهید ("نه، این‌طور انجامش بده") اغلب خودکار در حافظه ذخیره می‌شوند.
  t140: بیش از 80 مهارت باندل‌شده پوشش می‌دهد github، خلاقیت، mlops، بهره‌وری، پژوهش و بیشتر.
  t141: هر مهارت نصب‌شده خودبه‌خود به یک دستور slash تبدیل می‌شود — / را تایپ کنید تا همه را ببینید.
  t142: hermes skills install official/security/1password مهارت‌های اختیاری را از مخزن نصب می‌کند.
  t143: مهارت‌ها می‌توانند به پلتفرم‌های سیستم‌عامل مشخص محدود شوند — بعضی فقط روی macOS یا Linux بار می‌شوند.
  t144: skills.external_dirs در config.yaml اجازه می‌دهد مهارت‌ها را از پوشه‌های سفارشی بار کنید.
  t145: عامل می‌تواند با skill_manage برای خودش مهارت‌هایی به‌عنوان حافظه رویه‌ای بسازد.
  t146: /plan طرح پیاده‌سازی markdown را در .hermes/plans/ می‌نویسد، بدون اجرای هیچ چیزی.
  t147: 'وظایف زمان‌بندی می‌توانند مهارت داشته باشند: hermes cron add --skill blogwatcher "Check for new posts".'
  t148: مقاصد ارسال زمان‌بندی شامل telegram، discord، slack، email، sms و بیش از 12 پلتفرم دیگر است.
  t149: اگر پاسخ زمان‌بندی با [SILENT] شروع شود، ارسال سرکوب می‌شود — برای وظایف فقط-پایشی به کار می‌آید.
  t150: زمان‌بندی از تأخیر نسبی (30m)، بازه‌ها (every 2h)، عبارت‌های cron و مهر زمانی ISO پشتیبانی می‌کند.
  t151: وظایف زمان‌بندی در نشست‌های کاملاً تازه عامل اجرا می‌شوند — پرامپت‌ها باید خودبسنده باشند.
  t152: حالت صوتی بدون هیچ کلید API هم کار می‌کند اگر faster-whisper نصب باشد (تبدیل گفتار به متن محلی و رایگان).
  t153: 'پنج ارائه‌دهنده TTS در دسترس است: Edge TTS (رایگان)، ElevenLabs، OpenAI، NeuTTS (محلی و رایگان)، MiniMax.'
  t154: /voice on حالت صوتی را در CLI فعال می‌کند. Ctrl+B ضبط push-to-talk را روشن‌وخاموش می‌کند.
  t155: TTS جریانی جمله‌ها را همان‌طور که تولید می‌شوند پخش می‌کند — لازم نیست تا پاسخ کامل صبر کنید.
  t156: پیام‌های صوتی در تلگرام، Discord، WhatsApp و Slack به‌طور خودکار رونویسی می‌شوند.
  t157: 'رسا روی 21 پلتفرم پیام‌رسان اجرا می‌شود: تلگرام، Discord، Slack، WhatsApp، Signal، Matrix، IRC، Microsoft Teams، ایمیل و بیشتر.'
  t158: hermes gateway install آن را به‌عنوان سرویس سیستمی برپا می‌کند که با بوت شروع شود.
  t159: DingTalk از Stream Mode استفاده می‌کند — نه وب‌هوک می‌خواهد نه URL عمومی.
  t160: BlueBubbles با یک سرور محلی macOS پیام‌رسان iMessage را به رسا می‌آورد.
  t161: مسیرهای وب‌هوک از اعتبارسنجی HMAC، محدودسازی نرخ و فیلتر رویداد پشتیبانی می‌کنند.
  t162: سرور API یک نقطه پایانی سازگار با OpenAI دارد که با Open WebUI و LibreChat کار می‌کند.
  t163: 'حالت کانال صوتی Discord: ربات به VC می‌پیوندد، گفتار را رونویسی می‌کند و پاسخ می‌دهد.'
  t164: 'group_sessions_per_user: true به هر نفر در گفتگوهای گروهی نشست خودش را می‌دهد.'
  t165: /sethome یک گفتگو را به‌عنوان کانال خانه برای تحویل وظایف زمان‌بندی علامت می‌زند.
  t166: دروازه از مهلت‌های بر پایه بی‌فعالیتی پشتیبانی می‌کند — عامل‌های فعال می‌توانند بی‌نهایت اجرا شوند.
  t167: 'تأیید دستور خطرناک 4 سطح دارد: once، session، always (فهرست مجاز دائمی) و deny.'
  t168: حالت تأیید هوشمند از یک LLM استفاده می‌کند تا دستورهای امن را خودکار تأیید و خطرناک را نشانه‌گذاری کند.
  t169: محافظ SSRF شبکه‌های خصوصی، loopback، link-local و آدرس‌های فراداده ابری را مسدود می‌کند.
  t170: پیش‌اسکن Tirith جعل URL هم‌نما و الگوهای pipe-to-interpreter را تشخیص می‌دهد.
  t171: زیرفرایندهای MCP محیطی پالایه‌شده می‌گیرند — فقط متغیرهای سیستمی امن عبور می‌کنند.
  t172: فایل‌های زمینه (.hermes.md، AGENTS.md) پیش از بارگذاری از نظر تزریق پرامپت اسکن امنیتی می‌شوند.
  t173: command_allowlist در config.yaml الگوهای مشخص فرمان پوسته را برای همیشه تأیید می‌کند.
  t174: زمینه با رسیدن به آستانه خودکار فشرده می‌شود — حافظه‌ها ذخیره و تاریخچه خلاصه می‌شود.
  t175: نوار وضعیت با پر شدن زمینه زرد، سپس نارنجی و بعد قرمز می‌شود.
  t176: SOUL.md فایل اصلی هویت عامل است — با سفارشی کردنش رفتار را شکل دهید.
  t177: رسا زمینه پروژه را از .hermes.md، AGENTS.md، CLAUDE.md یا .cursorrules (اولین تطبیق) بار می‌کند.
  t178: فایل‌های AGENTS.md در زیرپوشه‌ها به‌تدریج همان‌طور که عامل به پوشه‌ها می‌رود پیدا می‌شوند.
  t179: فایل‌های زمینه سقف 20,000 نویسه دارند با کوتاه‌سازی هوشمند سر/دُم.
  t180: 'پنج ارائه‌دهنده مرورگر: Chromium محلی، Browserbase، Browser Use، Camofox و Firecrawl.'
  t181: Camofox مرورگر ضدتشخیص است — شاخه‌ای از فایرفاکس با جعل اثر انگشت به C++.
  t182: browser_navigate خودش تصویر وضعیت صفحه را برمی‌گرداند — لازم نیست بعدش browser_snapshot را صدا بزنید.
  t183: browser_vision با annotate=true برچسب‌های شماره‌دار را روی عناصر تعاملی می‌اندازد.
  t184: hermes mcp یک انتخاب‌گر تعاملی از MCPهای تأییدشده Nous باز می‌کند که با یک کلید نصب می‌شوند.
  t185: hermes mcp catalog سرورهای MCP تأییدشده Nous را که با مخزن عرضه می‌شوند فهرست می‌کند.
  t186: hermes mcp install <name> یک مدخل کاتالوگ را نصب می‌کند، اعتبارنامه می‌پرسد و اجازه می‌دهد انتخاب کنید کدام ابزارهایش فعال شود.
  t187: سرورهای MCP در config.yaml پیکربندی می‌شوند — هم ترابری stdio و هم HTTP پشتیبانی می‌شود.
  t188: 'پالایش ابزار به تفکیک سرور: tools.include فهرست سفید و tools.exclude فهرست سیاه ابزارهای مشخص است.'
  t189: سرورهای MCP در زمان اجرا خودشان مجموعه‌ابزار می‌سازند — hermes tools می‌تواند به تفکیک پلتفرم روشن‌وخاموششان کند.
  t190: 'پشتیبانی OAuth در MCP: auth: oauth اجازه‌دهی مبتنی بر مرورگر با PKCE را فعال می‌کند.'
  t191: نقطه‌های بازیابی وقتی فایلی تغییر نکند هیچ هزینه‌ای ندارند — به‌طور پیش‌فرض فعال‌اند.
  t192: پیش از بازگردانی، خودکار یک تصویر وضعیت ذخیره می‌شود تا بتوانید واگردِ واگرد را انجام دهید.
  t193: /rollback نوبت گفتگو را هم واگرد می‌کند، تا عامل تغییرات بازگردانده‌شده را به یاد نیاورد.
  t194: نقطه‌های بازیابی از مخزن‌های سایه در ~/.hermes/checkpoints/ استفاده می‌کنند — به .git پروژه شما هرگز دست نمی‌خورد.
  t195: batch_runner.py صدها پرامپت را موازی پردازش می‌کند؛ برای تولید داده آموزشی.
  t196: hermes chat -Q حالت بی‌صدا را برای استفاده برنامه‌ای فعال می‌کند — بنر و اسپینر را حذف می‌کند.
  t197: ذخیره مسیر حرکت (--save-trajectories) ردپای کامل استفاده از ابزارها را برای آموزش مدل ثبت می‌کند.
  t198: 'سه نوع افزونه: عمومی (ابزار/قلاب)، ارائه‌دهنده حافظه و موتور زمینه.'
  t199: hermes plugins install owner/repo افزونه‌ها را مستقیم از GitHub نصب می‌کند.
  t200: 'ارائه‌دهنده‌های حافظه خارجی: Honcho، OpenViking و Mem0 باندل شده‌اند؛ Hindsight و بیشتر از طریق hermes plugins install.'
  t201: قلاب‌های افزونه شامل pre/post_tool_call، pre/post_llm_call و transform_terminal_output برای یکدست‌سازی خروجی است.
  t202: کش پرامپت (Anthropic) با استفاده دوباره از پیشوندهای کش‌شده پرامپت سیستم هزینه را کم می‌کند.
  t203: عامل عناوین نشست را در رشته پس‌زمینه خودش می‌سازد — بدون هیچ تأثیر بر تأخیر.
  t204: مسیریابی هوشمند مدل می‌تواند پرسش‌های ساده را خودکار به مدل ارزان‌تر بفرستد.
  t205: 'دستورهای slash از تطبیق پیشوندی پشتیبانی می‌کنند: /h به /help و /mod به /model می‌رسد.'
  t206: کشیدن مسیر فایل به ترمینال، تصویر را خودکار پیوست می‌کند یا به‌عنوان زمینه می‌فرستد.
  t207: فایل .worktreeinclude در ریشه مخزن شما، فایل‌های gitignore‌شده‌ای را برای کپی به worktreeها فهرست می‌کند.
  t208: hermes acp رسا را به‌عنوان سرور ACP برای یکپارچگی با VS Code، Zed و JetBrains اجرا می‌کند.
  t209: 'ارائه‌دهنده‌های سفارشی: نقاط پایانی نام‌دار را در config.yaml زیر custom_providers ذخیره کنید.'
  t210: HERMES_EPHEMERAL_SYSTEM_PROMPT پرامپت سیستمی تزریق می‌کند که هرگز در تاریخچه ذخیره نمی‌شود.
  t211: credential_pool_strategies از fill_first، round_robin، least_used و چرخش تصادفی پشتیبانی می‌کند.
  t212: hermes auth add nous یا hermes auth add openai-codex ارائه‌دهنده‌های مبتنی بر OAuth را برپا می‌کند.
  t213: سرور API هم Chat Completions و هم Responses API را با وضعیت سمت سرور پشتیبانی می‌کند.
  t214: 'tool_preview_length: 0 در پیکربندی، مسیر کامل فایل‌ها را در فهرست فعالیت اسپینر نشان می‌دهد.'
  t215: hermes status --deep بررسی‌های تشخیصی عمیق‌تری روی همه اجزا اجرا می‌کند.
  t216: وظایف زمان‌بندی می‌توانند اسکریپت پایتونی داشته باشند (--script) که خروجی استانداردش به‌عنوان زمینه در پرامپت تزریق می‌شود.
  t217: اسکریپت‌های زمان‌بندی در ~/.hermes/scripts/ زندگی می‌کنند و پیش از عامل اجرا می‌شوند — عالی برای خط‌لوله‌های گردآوری داده.
  t218: prefill_messages_file در config.yaml نمونه‌های few-shot را به هر فراخوانی API تزریق می‌کند و هرگز در تاریخچه ذخیره نمی‌شود.
  t219: SOUL.md هویت پیش‌فرض عامل را کامل جایگزین می‌کند — بازنویسی‌اش کنید تا رسا مالِ خودتان شود.
  t220: SOUL.md در نخستین اجرا خودکار با شخصیتی پیش‌فرض بذرگذاری می‌شود. برای سفارشی‌سازی ویرایشش کنید.
  t221: /compress <focus topic> حدود 60-70٪ بودجه خلاصه را به موضوع شما می‌دهد و بقیه را به‌شدت کوتاه می‌کند.
  t222: در فشرده‌سازی دوم به بعد، فشرده‌ساز خلاصه قبلی را به‌روزرسانی می‌کند نه اینکه از صفر شروع کند.
  t223: پیش از بازنشانی نشست دروازه، رسا در پس‌زمینه حقایق مهم را خودکار به حافظه می‌ریزد.
  t224: 'network.force_ipv4: true در config.yaml گیر کردن سرورهایی با IPv6 خراب را درست می‌کند — socket را از جا وصله می‌کند.'
  t225: 'ابزار ترمینال کدهای خروج رایج را توضیح می‌دهد: خروج 1 برای grep یعنی ''چیزی پیدا نشد (خطا نیست)''.'
  t226: دستورهای ترمینال پیش‌زمینه‌ایِ شکست‌خورده تا 3 بار با پس‌رفت نمایی (2s، 4s، 8s) خودکار تلاش دوباره می‌کنند.
  t227: دستورهای sudo خالی خودکار بازنویسی می‌شوند تا SUDO_PASSWORD از .env پایپ شود — بدون پرامپت تعاملی.
  t228: 'کمک‌یارهای execute_code درون‌ریزی صریح می‌خواهند: from hermes_tools import json_parse, shell_quote, retry.'
  t229: 7 ابزار سندباکس execute_code (web_search، terminal، read/write/search/patch) با RPC کار می‌کنند — هرگز وارد زمینه نمی‌شوند.
  t230: خواندن 3 بار یا بیشترِ همان ناحیه فایل هشدار می‌دهد. از 4 بار به بعد، برای جلوگیری از حلقه سد سخت می‌شود.
  t231: write_file و patch تشخیص می‌دهند اگر فایلی از آخرین خواندن بیرون از برنامه تغییر کرده باشد و درباره کهنگی هشدار می‌دهند.
  t232: قالب پچ V4A از دستورهای Add File، Delete File و Move File پشتیبانی می‌کند — فقط Update نیست.
  t233: سرورهای MCP می‌توانند با sampling تکمیل‌های LLM را پس بگیرند — عامل به ابزاری برای سرور تبدیل می‌شود.
  t234: سرورهای MCP اعلان notifications/tools/list_changed می‌فرستند تا ابزارها بدون راه‌اندازی مجدد دوباره ثبت شوند.
  t235: 'delegate_task با acp_command: ''claude''، Claude Code را به‌عنوان عامل فرزند از هر پلتفرمی به راه می‌اندازد.'
  t236: سپردن کار یک رشته تپش قلب دارد — فعالیت فرزند به والد منتقل می‌شود و مانع مهلت‌خوردن دروازه است.
  t237: وقتی ارائه‌دهنده‌ای HTTP 402 (پرداخت لازم است) برگرداند، مشتری کمکی خودکار به بعدی برمی‌گردد.
  t238: agent.tool_use_enforcement مدل‌هایی را که به‌جای صدا زدن ابزار، کارها را توصیف می‌کنند راهنمایی می‌کند — برای GPT/Codex خودکار است.
  t239: agent.restart_after_turn_timeout اجازه می‌دهد نوبت‌های در جریان پیش از ورود /restart به stop() تمام شوند؛ restart_drain_timeout فقط بودجه وقفه اجباری پس از شروع stop() است.
  t240: agent.api_max_retries (پیش‌فرض 3) تعیین می‌کند عامل چند بار پیش از نمایش خطا، فراخوانی API شکست‌خورده را تلاش دوباره کند — برای جایگزینی سریع کمش کنید.
  t241: دروازه نمونه‌های AIAgent را به تفکیک نشست کش می‌کند — از بین بردن این کش، کش پرامپت Anthropic را می‌شکند.
  t242: هر وب‌سایتی می‌تواند مهارت‌ها را با /.well-known/skills/index.json عرضه کند — هاب مهارت‌ها خودش کشفشان می‌کند.
  t243: لاگ حسابرسی مهارت‌ها در ~/.hermes/skills/.hub/audit.log هر عمل نصب و حذف را ثبت می‌کند.
  t244: 'worktreeهای کهنه git در شروع، خودکار پاک می‌شوند: درخت‌های تمیز و کاملاً ادغام‌شده هرس می‌شوند؛ کار کثیف یا پوش‌نشده همیشه حفظ می‌شود.'
  t245: پروفایل‌ها وضعیت رسا را با HERMES_HOME محدوده‌بندی می‌کنند؛ زیرفرایندهای ابزار میزبان تا وقتی terminal.home_mode برابر profile نباشد HOME واقعی شما را نگه می‌دارند.
  t246: متغیر محیطی HERMES_HOME_MODE (اکتال، مثلاً 0701) مجوزهای سفارشی پوشه را برای عبور سرور وب تنظیم می‌کند.
  t247: 'حالت کانتینر: فایل .container-mode را در HERMES_HOME بگذارید تا CLI میزبان خودکار به درون کانتینر exec شود.'
  t248: 'Ctrl+C پنج سطح اولویت دارد: لغو ضبط → لغو پرسش‌ها → لغو انتخاب‌گر → قطع عامل → خروج.'
  t249: هر وقفه در حین اجرای عامل با مهر زمانی در ~/.hermes/interrupt_debug.log ثبت می‌شود.
  t250: BROWSER_CDP_URL ابزارهای مرورگر را به هر مرورگر Chromiumی در حال اجرا وصل می‌کند — WebSocket، HTTP یا host:port می‌پذیرد.
  t251: BROWSERBASE_ADVANCED_STEALTH=true ضدتشخیص پیشرفته با Chromium سفارشی را فعال می‌کند (Scale Plan).
  t252: CLI در ترمینال‌های باریک‌تر از 80 ستون خودکار به حالت فشرده می‌رود.
  t253: 'دستورهای سریع دو نوع دارند: exec (اجرای مستقیم فرمان پوسته) و alias (هدایت به دستور دیگر).'
  t254: 'مدل سپردن کار به تفکیک وظیفه: delegation.model و delegation.provider در پیکربندی، زیرعامل‌ها را به مدل‌های ارزان‌تر می‌فرستند.'
  t255: delegation.reasoning_effort عمق تفکر زیرعامل‌ها را مستقلاً کنترل می‌کند.
  t256: 'display.platforms در config.yaml بازنویسی نمایش به تفکیک پلتفرم می‌دهد: {telegram: {tool_progress: all}}.'
  t257: human_delay.mode در پیکربندی سرعت تایپ انسانی را شبیه‌سازی می‌کند — بازه min_ms/max_ms قابل تنظیم.
  t258: مهاجرت‌های نسخه پیکربندی هنگام بارگذاری خودکار اجرا می‌شوند — کلیدهای جدید بدون دخالت دستی ظاهر می‌شوند.
  t259: مدل‌های GPT و Codex راهنمای ویژه پرامپت سیستمی برای انضباط ابزار و استفاده اجباری از ابزار می‌گیرند.
  t260: مدل‌های Gemini دستورالعمل‌های مخصوص مسیرهای مطلق، فراخوانی‌های موازی ابزار و فرمان‌های غیرتعاملی می‌گیرند.
  t261: context.engine در config.yaml را می‌توان نام یک افزونه گذاشت برای راهبردهای جایگزین مدیریت زمینه.
  t262: تصویر وضعیت صفحه مرورگر بالای 15,000 نویسه کوتاه یا خودکار خلاصه می‌شود؛ تصویر کامل در cache/web ذخیره می‌شود تا با read_file صفحه‌بندی شود.
  t263: 'فشرده‌ساز یک پیش‌گذر ارزان انجام می‌دهد: خروجی‌های ابزار بالای 200 نویسه پیش از اجرای LLM با جانگهدارها جایگزین می‌شوند.'
  t264: وقتی فشرده‌سازی شکست بخورد، تلاش‌های بعدی 10 دقیقه مکث می‌کنند تا API زیر فشار نرود.
  t265: دستورهای خطرناک طولانی (بیش از 70 نویسه) در پرامپت تأیید گزینه 'view' می‌گیرند تا اول متن کامل را ببینید.
  t266: تصویرسازی سطح صدا هنگام ضبط صدا بر اساس سطح RMS میکروفون میله‌های ▁▂▃▄▅▆▇ نشان می‌دهد.
  t267: نام پروفایل‌ها نمی‌تواند با برنامه‌های باینری موجود PATH تداخل کند — 'hermes profile create ls' رد می‌شود.
  t268: hermes profile create backup --clone-all همه‌چیز را کپی می‌کند (پیکربندی، کلیدها، SOUL.md، حافظه‌ها، مهارت‌ها، نشست‌ها).
  t269: کلید ضبط صدا با voice.record_key در config.yaml قابل تنظیم است — فقط Ctrl+B نیست.
  t270: فایل‌های .cursorrules و .cursor/rules/*.mdc خودکار تشخیص و به‌عنوان زمینه پروژه بار می‌شوند.
  t271: فایل‌های زمینه بیش از 10 الگوی تزریق پرامپت را می‌سنجند — یونیکد نامرئی، 'ignore instructions'، تلاش برای بیرون‌کشی.
  t272: GPT-5 و Codex در قالب پیام از نقش 'developer' به‌جای 'system' استفاده می‌کنند.
  t273: 'بازنویسی کمکی به تفکیک وظیفه: auxiliary.vision.provider، auxiliary.compression.model و غیره در config.yaml.'
  t274: مشتری کمکی 'main' را به‌عنوان نام مستعار ارائه‌دهنده می‌گیرد — به ارائه‌دهنده و مدل اصلی واقعی شما می‌رسد.
  t275: hermes claw migrate --dry-run مهاجرت OpenClaw را پیش‌نمایش می‌کند، بدون نوشتن چیزی.
  t276: مسیرهای فایل که با کوتیشن یا فاصله گریز‌دار چسبانده می‌شوند خودکار مدیریت می‌شوند — نیازی به تمیزکاری دستی نیست.
  t277: دستورهای slash هرگز چروک شدن چسباندن بزرگ را فعال نمی‌کنند — /command با آرگومان‌های بزرگ درست کار می‌کند.
  t278: در حالت وقفه، دستورهای slash که هنگام اجرای عامل تایپ می‌شوند از منطق وقفه می‌گذرند و بلافاصله اجرا می‌شوند.
  t279: HERMES_DEV=1 تشخیص حالت کانتینر را برای توسعه محلی دور می‌زند.
  t280: هر سرور MCP مجموعه‌ابزار خودش را دارد (mcp-servername) که می‌توان مستقل از بقیه با hermes tools روشن‌وخاموشش کرد.
  t281: جانگهدارهای MCP ${ENV_VAR} در پیکربندی هنگام راه‌اندازی سرور حل می‌شوند — از جمله متغیرهای ~/.hermes/.env.
  t282: مهارت‌های مخزن‌های مورد اعتماد (NousResearch) سطح امنیتی 'trusted' می‌گیرند؛ مهارت‌های اجتماعی اسکن اضافه می‌خورند.
  t283: قرنطینه مهارت‌ها در ~/.hermes/skills/.hub/quarantine/ مهارت‌های در انتظار بازبینی امنیتی را نگه می‌دارد.
  t284: /steer <prompt> یادداشتی را پس از فراخوانی بعدی ابزار تزریق می‌کند — وسط کار مسیر را عوض کنید، بدون وقفه.
  t285: /goal <text> هدفی ایستاده از نوع حلقه Ralph تعیین می‌کند — رسا نوبت‌به‌نوبت خودش ادامه می‌دهد تا داوری بگوید تمام.
  t286: /snapshot create [label] تصویر وضعیت کامل پیکربندی رسا را ذخیره می‌کند؛ /snapshot restore <id> بعداً برمی‌گرداند.
  t287: /copy [N] آخرین پاسخ دستیار را در کلیپ‌بورد کپی می‌کند، یا با عدد، N-اُمین از آخر را.
  t288: /redraw بازترسیم کامل رابط را اجباری می‌کند و ناهماهنگی ترمینال پس از تغییر اندازه tmux یا بقایای انتخاب موس را درست می‌کند.
  t289: /agents (نام مستعار /tasks) عامل‌های فعال و وظایف پس‌زمینه در حال اجرا را در نشست جاری نشان می‌دهد.
  t290: /footer پانویس دروازه در پاسخ‌های نهایی را روشن‌وخاموش می‌کند که مدل، درصد زمینه و cwd را نشان می‌دهد.
  t291: /busy queue|steer|interrupt تعیین می‌کند فشردن Enter هنگام کار رسا چه کند.
  t292: /topic در گفتگوی خصوصی تلگرام حالت موضوعی چندنشستِ مدیریت‌شده توسط کاربر را فعال می‌کند — /topic <id> نشست‌های قبلی را درجا برمی‌گرداند.
  t293: /approve session|always دستور خطرناک در انتظار را با دامنه اعتماد انتخابی شما اجرا می‌کند؛ /deny آن را رد می‌کند.
  t294: /restart پس از پایان کارهای فعال، دروازه را به‌شکل نرم راه‌اندازی مجدد می‌کند و وقتی بالا آمد به درخواست‌دهنده خبر می‌دهد.
  t295: /kanban boards switch <slug> تابلوی Kanban چندپروژه‌ای فعال را از درون گفتگو عوض می‌کند.
  t296: /reload فایل ~/.hermes/.env را در نشست در حال اجرا دوباره بار می‌کند — کلیدهای API جدید را بدون راه‌اندازی مجدد بگیرید.
  t297: زمان‌بندی با no_agent=True یک اسکریپت را طبق برنامه اجرا و خروجی استانداردش را مستقیم می‌فرستد — صفر توکن، صفر LLM.
  t298: خروجی خالی اسکریپت زمان‌بندی یعنی تیک بی‌صدا — چیزی ارسال نمی‌شود؛ عالی برای نگهبان‌های آستانه.
  t299: HERMES_CRON_MAX_PARALLEL (پیش‌فرض 4) سقف تعداد وظایف زمان‌بندیِ اجراشونده در هر تیک است تا موج‌های ناگهانی کلیدهایتان را سیر نکنند.
  t300: قلاب‌های دروازه زیر ~/.hermes/hooks/<name>/ با HOOK.yaml + handler.py زندگی می‌کنند — تابع باید `handle` نام داشته باشد.
  t301: رویدادهای قلاب شامل gateway:startup، session:start، agent:step و اشتراک‌های والکارد command:* است.
  t302: فهرست کار ~/.hermes/BOOT.md را بیندازید تا یک قلاب gateway:startup در هر بوت، آن را به‌صورت یک عامل تک‌موردی اجرا کند.
  t303: hermes curator run --dry-run پیش‌نمایش می‌دهد که نگهبان مهارت‌ها چه چیزی را بایگانی یا ادغام می‌کرد، بدون تغییر دادن چیزی.
  t304: hermes curator pin <skill> یک مهارت را هم در برابر بایگانی خودکار و هم ابزار skill_manage عامل سد می‌کند.
  t305: hermes curator rollback مهارت‌ها را از تصویر وضعیت پیش از اجرا برمی‌گرداند — پشتیبان‌ها زیر skills/.curator_backups/ هستند.
  t306: hermes auth reset <provider> [target] مهلت‌های خنکا و پرچم‌های فرسودگی را روی کل استخر اعتبارنامه، یا روی یک اعتبارنامه با شاخص، شناسه یا برچسب پاک می‌کند.
  t307: 'credential_pool_strategies.<provider>: round_robin کلیدها را یک‌درمیان می‌چرخاند، نه با پیش‌فرض fill_first.'
  t308: 'use_gateway: true به تفکیک ابزار، وب، تصویر، tts یا مرورگر را از اشتراک Nous شما عبور می‌دهد — بدون کلید اضافه.'
  t309: 'provider_routing.data_collection: deny ارائه‌دهنده‌های ذخیره‌کننده داده را روی OpenRouter حذف می‌کند.'
  t310: 'provider_routing.require_parameters: true فقط به ارائه‌دهنده‌هایی می‌رود که همه پارامترهای درخواست شما را پشتیبانی می‌کنند.'
  t311: HERMES_TUI_RESUME=1 هنگام راه‌اندازی خودکار به تازه‌ترین نشست TUI دوباره وصل می‌شود — بعد از قطع SSH به کار می‌آید.
  t312: HERMES_TUI_THEME=light|dark|<hex> تم TUI را روی ترمینال‌هایی که COLORFGBG نمی‌گذارند اجباری می‌کند.
  t313: Ctrl+G یا Ctrl+X سپس Ctrl+E در TUI بافر ورودی را در $EDITOR باز می‌کند؛ برای پرامپت‌های طولانی چندخطی.
  t314: TUI فرمول‌های LaTeX را درون‌خطی رندر می‌کند — $E=mc^2$ به ریاضی یونیکد تبدیل می‌شود، نه TeX خام.
  t315: hermes dashboard یک رابط وب محلی روی 127.0.0.1:9119 راه می‌اندازد — هیچ داده‌ای از localhost بیرون نمی‌رود.
  t316: hermes dashboard تویکلاه TUI کامل رسا را با xterm.js و یک PTY روی WebSocket در مرورگر شما جاسازی می‌کند.
  t317: یک YAML با دو رنگ پالت در ~/.hermes/dashboard-themes/ بگذارید تا پوسته کل داشبورد عوض شود.
  t318: 'افزونه‌های داشبورد سر‌ریخته‌اند: manifest.json + بسته JS در ~/.hermes/dashboard-plugins/ — بدون نیاز به build با npm.'
  t319: 'layoutVariant: cockpit در تم داشبورد ریل چپ 260 پیکسلی اضافه می‌کند که افزونه‌ها با جایگاه sidebar پرش می‌کنند.'
  t320: 'display.tool_progress_command: true گزینه /verbose را روی پلتفرم‌های پیام‌رسان باز می‌کند؛ به‌طور پیش‌فرض فقط CLI است.'
  t321: HERMES_BACKGROUND_NOTIFICATIONS=result فقط وقتی وظایف پس‌زمینه تمام می‌شوند خبر می‌دهد (به‌جای concise/all/error/off).
  t322: 'HERMES_WRITE_SAFE_ROOT مسیرهای write_file/patch را به پیشوندهای پوشه محدود می‌کند؛ چند مسیر با os.pathsep (: یا ;).'
  t323: HERMES_IGNORE_RULES تزریق خودکار AGENTS.md، SOUL.md، .cursorrules، حافظه و مهارت‌های پیش‌بارشده را رد می‌کند.
  t324: HERMES_ACCEPT_HOOKS قلاب‌های پوسته تعریف‌نشده در config.yaml را بدون پرامپت TTY خودکار تأیید می‌کند.
  t325: auxiliary.goal_judge.model داور /goal را به مدلی ارزان و سریع می‌فرستد تا هزینه حلقه نزدیک صفر بماند.
  t326: نقطه‌های بازیابی از پوشه‌های با بیش از 50,000 فایل می‌گذرند تا عملیات کند git روی مونوریپوهای عظیم رخ ندهد.
  t327: 'tts.provider: piper گفتارساز محلی 44 زبانه را روی CPU اجرا می‌کند — صداها خودکار در ~/.hermes/cache/piper-voices/ بارگیری می‌شوند.'
  t328: 'tts.providers.<name>.type: command هر موتور گفتارساز CLI را با جانگهدارهای {input_path} و {output_path} وصل می‌کند.'
  t329: API_SERVER_ENABLED=true در کنار دروازه یک نقطه پایانی سازگار با OpenAI اجرا می‌کند؛ برای Open WebUI و LibreChat.
  t330: 'GATEWAY_PROXY_URL چیدمان دوپاره می‌سازد: ورودی/خروجی پلتفرم محلی، کار عامل به سرور API دوردست سپرده می‌شود.'
  t331: MATRIX_DEVICE_ID برای E2EE یک شناسه دستگاه پایدار می‌خکوب می‌کند — بدون آن، کلیدها هر بار در شروع می‌چرخند و رمزگشایی گذشته می‌شکند.
  t332: هر وقت TELEGRAM_WEBHOOK_URL تنظیم شود، TELEGRAM_WEBHOOK_SECRET الزامی است — با openssl rand -hex 32 بسازید.
  t333: batch_runner.py --resume پرامپت‌های تکمیل‌شده را با تطبیق متن پیدا می‌کند تا جابه‌جایی ترتیب داده، کارهای تمام‌شده را دوباره اجرا نکند.
  t334: /new همان‌جا نشست تازه‌ای شروع می‌کند (نام مستعار /reset) — شناسه نشست جدید، تاریخچه تمیز، و CLI باز می‌ماند.
  t335: /clear صفحه ترمینال را پاک می‌کند و نشست جدیدی شروع می‌کند — یک میان‌بر برای بازنشانی دیداری.
  t336: /history گفتگوی جاری را بدون ترک CLI درون‌خطی چاپ می‌کند — برای مرور سریع به کار می‌آید.
  t337: /save گفتگوی جاری را بدون پایان دادن به نشست روی دیسک می‌نویسد.
  t338: '/status اطلاعات نشست را یک‌جا نشان می‌دهد: شناسه، عنوان، مدل، مصرف توکن و زمان سپری‌شده.'
  t339: /image <path> فایل تصویری محلی را بدون چسباندن یا کشیدن‌ورهاکردن، برای پرامپت بعدی پیوست می‌کند.
  t340: /platforms وضعیت اتصال دروازه و پلتفرم‌های پیام‌رسان را مستقیم از درون گفتگو نشان می‌دهد.
  t341: /commands فهرست کامل دستورهای slash و مهارت‌های نصب‌شده را صفحه‌بندی می‌کند — برای پلتفرم‌هایی بدون تکمیل تب به کار می‌آید.
  t342: /toolsets همه مجموعه‌ابزارهای موجود را فهرست می‌کند تا بدانید -t/--toolsets چه می‌پذیرد.
  t343: /voice tts حالت فقط-TTS را روشن‌وخاموش می‌کند — عامل بلند جواب می‌دهد ولی شما پرامپت را تایپ می‌کنید.
  t344: /reload-skills پوشه ~/.hermes/skills/ را دوباره اسکن می‌کند تا مهارت‌های سر‌ریخته بدون راه‌اندازی مجدد نشست دیده شوند.
  t345: /indicator kaomoji|emoji|unicode|ascii سبک نشانگر اشتغال TUI را که هنگام اجرای عامل دیده می‌شود انتخاب می‌کند.
  t346: /debug یک بسته پشتیبانی (اطلاعات سیستم + لاگ‌ها) بارگذاری می‌کند و پیوند قابل اشتراک برمی‌گرداند — در گفتگو هم کار می‌کند.
  t347: 'hermes -z "<prompt>" خالص‌ترین حالت یک‌باره است: فقط پاسخ نهایی روی stdout، هیچ چیز دیگر — عالی برای پایپ در اسکریپت‌ها.'
  t348: hermes chat --pass-session-id شناسه نشست را در پرامپت سیستمی تزریق می‌کند تا عامل بتواند به آن ارجاع بدهد.
  t349: hermes chat --image path/to/pic.png تصویری محلی را به یک پرسش -q پیوست می‌کند، بدون گام بارگذاری جدا.
  t350: hermes chat --ignore-user-config از پیکربندی کاربر فعال می‌گذرد — گزارش اشکال و اجرای CI قابل بازتولید.
  t351: hermes chat --source tool گفتگوهای برنامه‌ای را برچسب می‌زند تا فهرست hermes sessions list را شلوغ نکنند.
  t352: hermes dump --show-keys اثرانگشت‌های پوشانده‌شده کلیدهای API را برای اشکال‌زدایی عمیق‌تر پشتیبانی نشان می‌دهد.
  t353: hermes sessions rename <ID> "new title" هر نشست قبلی را نام‌گذاری دوباره می‌کند؛ hermes sessions delete <ID> یکی را حذف می‌کند.
  t354: hermes import پشتیبان کامل zip رسا را بازمی‌گرداند؛ برون‌بری‌های JSON/JSONL نشست از صفحه نشست‌های داشبورد درون‌ریزی می‌شوند.
  t355: hermes fallback زنجیره fallback_model را تعاملی مدیریت می‌کند — بدون ویرایش دستی config.yaml.
  t356: hermes pairing توکن جفت‌سازی گفتگوی خصوصی را می‌چرخاند — نخستین پیام‌فرستنده پس از چرخش، دسترسی به ربات را می‌گیرد.
  t357: hermes setup کاربران نخست‌بار را در یک جریان تعاملی، گام‌به‌گام از ارائه‌دهنده، کلیدها و اتصال پلتفرم عبور می‌دهد.
  t358: hermes status --deep سلامت همه اجزا را کامل بررسی می‌کند؛ hermes status ساده، نمای سریع است.
  t359: HERMES_AGENT_TIMEOUT=0 کشتن بی‌فعالیتی دروازه برای عامل در حال اجرا را خاموش می‌کند — برای اجراهای پژوهشی طولانی.
  t360: HERMES_ENABLE_PROJECT_PLUGINS=1 افزونه‌های محلی مخزن را از ./.hermes/plugins/ خودکار بار می‌کند — از طراحی، گیت اعتماد دارد.
  t361: HERMES_DISABLE_FILE_STATE_GUARD=1 نگهبان 'فایل از آخرین خواندن تغییر کرده' را روی patch و write_file خاموش می‌کند.
  t362: HERMES_ALLOW_PRIVATE_URLS=true اجازه می‌دهد ابزارهای وب به localhost و شبکه‌های خصوصی بزنند — در حالت دروازه به‌طور پیش‌فرض خاموش است.
  t363: HERMES_OPTIONAL_SKILLS=name1,name2 در نخستین اجرای هر پروفایل، مهارت‌های اختیاری اضافه کاتالوگ را خودکار نصب می‌کند.
  t364: HERMES_BUNDLED_SKILLS به درخت سفارشی مهارت‌های باندل اشاره می‌کند — بسته‌بندی Homebrew و Nix از آن استفاده می‌کند.
  t365: HERMES_DUMP_REQUEST_STDOUT=1 بار هر درخواست API را به‌جای فایل‌های لاگ روی stdout می‌ریزد.
  t366: HERMES_OAUTH_TRACE=1 تلاش‌های تبادل و نوسازی توکن OAuth (پوشانده‌شده) را برای اشکال‌زدایی احراز هویت ارائه‌دهنده لاگ می‌کند.
  t367: HERMES_STREAM_RETRIES (پیش‌فرض 3) تعداد تلاش‌های اتصال دوباره در میانه استریم برای خطاهای گذرای شبکه را کنترل می‌کند.
  t368: HERMES_GATEWAY_BUSY_ACK_ENABLED=false پیام‌های ⚡/⏳/⏩ را وقتی کاربر به عامل مشغول پیام می‌دهد بی‌صدا می‌کند.
  t369: HERMES_AGENT_NOTIFY_INTERVAL (پیش‌فرض 180s) تعیین می‌کند دروازه در نوبت‌های طولانی چقدر یک‌بار با پیشرفت خبر بدهد.
  t370: HERMES_RESTART_DRAIN_TIMEOUT (پیش‌فرض 900s) سقف انتظار /restart برای کارهای در جریان پیش از اجبار است.
  t371: HERMES_CHECKPOINT_TIMEOUT (پیش‌فرض 30s) سقف ساخت نقطه بازیابی سیستم فایل است — روی مونوریپوهای عظیم بالایش ببرید.
  t372: 'image_gen.model در config.yaml مدل FAL را انتخاب می‌کند: flux-2/klein، gpt-image-2، nano-banana-pro و بیشتر.'
  t373: image_gen.provider تولید تصویر را از مسیر یک افزونه (OpenAI Images، Codex، FAL) عبور می‌دهد، نه پیش‌فرض.
  t374: AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY تحلیل بینایی را به هر نقطه پایانی سازگار با OpenAI نشانه می‌رود.
  t375: 'security.tirith_fail_open: false کاری می‌کند رسا وقتی خود پویشگر tirith خطا بدهد، دستورها را مسدود کند.'
  t376: متغیر محیطی TIRITH_FAIL_OPEN بر پیکربندی tirith_fail_open اولویت دارد — کلید سریع بدون ویرایش config.yaml.
  t377: گفتگوهای --source tool به‌طور پیش‌فرض از hermes sessions list حذف می‌شوند — برای دیدنشان --source را صریح بدهید.
  t378: شناسه‌های نشست پیشوند مهر زمانی دارند (20250305_091523_abcd) تا مرتب‌سازی در ls و jq طبیعی از کار درآید.
  t379: API_SERVER_MODEL_NAME نام مدل را روی /v1/models سفارشی می‌کند — برای راه‌اندازی‌های چندپروفایلی Open WebUI ضروری است.
  t380: افزونه‌های داشبورد از /dashboard-plugins/<name>/ سرو می‌شوند — فایل‌ها را در ~/.hermes/dashboard-plugins/ بیندازید.
